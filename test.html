<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 video playback test</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f0f17; color: #e8e8f0; padding: 20px; }
  video { width: 100%; max-width: 640px; background: #000; margin-top: 12px; }
  h2 { font-size: 1rem; margin-top: 24px; }
  code { background: #1e1e30; padding: 2px 6px; border-radius: 3px; }
  #log { background: #1a1a24; padding: 12px; border-radius: 6px; font-size: 0.75rem; min-height: 120px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>V2 raw playback test</h1>
<p>Loads <code>Practice_Pilates.mp4</code> (smallest V2 file) with no interaction JS.</p>

<h2>1. Native &lt;source&gt; tag (recommended)</h2>
<video id="v1" controls playsinline webkit-playsinline preload="metadata">
  <source src="https://github.com/fukexuexue/interactive-video-vlog/releases/download/v1/Practice_Pilates.mp4" type="video/mp4">
</video>

<h2>2. Direct src attribute</h2>
<video id="v2" controls playsinline webkit-playsinline preload="metadata"
       src="https://github.com/fukexuexue/interactive-video-vlog/releases/download/v1/Practice_Pilates.mp4"></video>

<h2>Event log</h2>
<div id="log">Loading...</div>

<script>
const log = document.getElementById('log');
function write(msg) { log.textContent += '\n' + new Date().toISOString().slice(11,19) + '  ' + msg; }
log.textContent = 'User agent: ' + navigator.userAgent;

['v1','v2'].forEach(id => {
  const v = document.getElementById(id);
  ['loadstart','loadedmetadata','loadeddata','canplay','playing','error','stalled','waiting'].forEach(ev => {
    v.addEventListener(ev, () => {
      const info = ev === 'error' ? ` (code=${v.error?.code} ${v.error?.message||''})` : '';
      write(`[${id}] ${ev}${info}`);
    });
  });
});
</script>
</body>
</html>
