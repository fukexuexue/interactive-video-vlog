<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>The Bajo People — Interactive Documentary</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #060c18;
  color: #a8becc;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 11px 26px;
  border-bottom: 1px solid #0e1e30;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-shrink: 0;
}
header h1 { font-size: 0.65rem; font-weight: 400; color: #2a3d52; letter-spacing: 2.5px; text-transform: uppercase; }
header h2 { font-size: 1rem; font-weight: 500; color: #b8cede; }

.main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ══ OCEAN PANEL ══ */
.ocean-panel {
  width: 358px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #0e1e30;
}
.ocean-label {
  padding: 7px 12px;
  font-size: 0.58rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #1a2d40;
  border-bottom: 1px solid #0e1e30;
  flex-shrink: 0;
}
.ocean-body {
  flex: 1;
  display: flex;
  min-height: 0;
}
#ocean-svg {
  flex: 1;
  display: block;
  cursor: pointer;
}
/* Depth ruler */
.depth-ruler {
  width: 42px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #0e1e30;
  padding: 4px 0;
}
.d-mark {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-bottom: 1px solid #0e1e30;
}
.d-mark:last-child { border-bottom: none; }
.d-num  { font-size: 0.58rem; color: #1e3348; font-weight: 600; letter-spacing: 0.3px; }
.d-unit { font-size: 0.5rem;  color: #152230; }

/* SVG layer transitions */
.ocean-layer { transition: filter 0.25s; }
.coral-el    { transition: filter 2s ease, opacity 2s ease; }
.fish-g      { transition: opacity 2s ease; }
#shockwave   { transition: opacity 1.5s ease; }
#diver-g     { transition: opacity 1.8s ease; }
#children-g  { transition: opacity 1.8s ease; }

/* ══ RIGHT PANEL ══ */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 14px 22px 12px;
  gap: 11px;
  min-width: 0;
}

.clip-info {
  flex-shrink: 0;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  min-height: 60px;
}
.clip-n {
  font-size: 2.4rem;
  font-weight: 700;
  color: #0e1e30;
  line-height: 1;
  width: 38px;
  flex-shrink: 0;
  transition: color 0.7s ease;
  letter-spacing: -1px;
}
.clip-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.clip-depth { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #1e3348; }
.clip-title { font-size: 1rem; font-weight: 600; color: #c4d8e8; transition: color 0.7s ease; }
.clip-desc  { font-size: 0.72rem; color: #4a6878; line-height: 1.55; margin-top: 2px; }
.clip-role  { font-size: 0.6rem;  color: #1a2d3e; margin-top: 3px; letter-spacing: 0.3px; font-style: italic; }

.video-wrapper {
  position: relative; flex: 1; min-height: 0;
  border-radius: 8px; overflow: hidden; background: #030810;
}
#video-player { width: 100%; height: 100%; object-fit: contain; display: block; }
#idle-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: #122030; font-size: 0.78rem; pointer-events: none;
}
.idle-arr { font-size: 1.6rem; animation: drift 2.2s ease-in-out infinite; }
@keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-9px)} }

/* Timeline strip */
.timeline-strip { flex-shrink: 0; display: flex; gap: 4px; height: 34px; }
.t-seg {
  flex: 1; border-radius: 5px; border: 1px solid #0e1e30;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 0.6rem; color: #1a2d40;
  transition: all 0.3s; text-align: center; padding: 0 3px; gap: 4px;
}
.t-seg:hover { border-color: #2a4060; color: #5a8aaa; }
.t-seg .t-n  { font-weight: 700; font-size: 0.75rem; }
.t-seg .t-label { font-size: 0.55rem; letter-spacing: 0.3px; display: none; }
.t-seg.active .t-label { display: block; }

/* ══ DYNAMITE ══ */
#dynamite-group {
  cursor: grab;
  filter: drop-shadow(0 0 6px rgba(220,60,40,0.45));
  transition: filter 0.25s;
}
#dynamite-group:hover   { filter: drop-shadow(0 0 12px rgba(255,80,40,0.75)); }
#dynamite-group.dy-drag { cursor: grabbing; filter: drop-shadow(0 0 20px rgba(255,100,40,1)); }

@keyframes fuse-blink {
  0%,100% { opacity: 1;   fill: #f9d874; }
  50%      { opacity: 0.2; fill: #f57f17; }
}
#fuse-spark { animation: fuse-blink 0.65s ease-in-out infinite; }

#throw-arc, #explosion-rings { pointer-events: none; }

/* ══ FISHERMAN ══ */
#fisherman-group {
  cursor: grab;
  filter: drop-shadow(0 0 7px rgba(80,160,255,0.45));
  transition: filter 0.3s;
}
#fisherman-group:hover  { filter: drop-shadow(0 0 12px rgba(80,160,255,0.7)); }
#fisherman-group.dragging { cursor: grabbing; filter: drop-shadow(0 0 18px rgba(80,160,255,0.9)); }

#fisher-surface, #fisher-underwater { transition: opacity 0.38s ease; }
#fish-line-dyn  { pointer-events: none; transition: opacity 0.4s ease; }

.layer-flash    { transition: filter 0.28s ease; }

/* Tooltip */
#tooltip {
  position: fixed; background: rgba(3,8,18,0.96);
  border: 1px solid #122030; color: #6a9ab8;
  padding: 5px 11px; border-radius: 6px; font-size: 0.68rem;
  pointer-events: none; display: none; z-index: 99; white-space: nowrap;
}
</style>
</head>
<body>

<header>
  <h1>Documentary</h1>
  <h2>The Bajo People — Living with the Sea</h2>
</header>

<div class="main">

  <!-- LEFT: Ocean navigation -->
  <div class="ocean-panel">
    <div class="ocean-label">Summary · Click a layer to watch</div>
    <div class="ocean-body">

      <svg id="ocean-svg" viewBox="0 0 310 500" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="sky-g"     x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#071428"/>
            <stop offset="55%"  stop-color="#123568"/>
            <stop offset="100%" stop-color="#195a8a"/>
          </linearGradient>
          <linearGradient id="shal-g"    x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#106888"/>
            <stop offset="100%" stop-color="#0a4565"/>
          </linearGradient>
          <linearGradient id="mid-g"     x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0a4565"/>
            <stop offset="100%" stop-color="#062640"/>
          </linearGradient>
          <linearGradient id="deep-g"    x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#062640"/>
            <stop offset="100%" stop-color="#020c1e"/>
          </linearGradient>
          <linearGradient id="abyss-g"   x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#020c1e"/>
            <stop offset="100%" stop-color="#010508"/>
          </linearGradient>
          <radialGradient id="sun-g" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#f9d56e" stop-opacity="1"/>
            <stop offset="65%"  stop-color="#f4a61d" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#e67e22" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- ════════════════════════════
             LAYER 1 — SKY / SURFACE
             y: 0–95
        ════════════════════════════ -->
        <g id="layer-living" class="ocean-layer" data-clip="living">
          <rect x="0" y="0" width="310" height="95" fill="url(#sky-g)"/>

          <!-- Sun -->
          <circle cx="274" cy="24" r="30" fill="url(#sun-g)" opacity="0.85"/>
          <circle cx="274" cy="24" r="13" fill="#f9d56e" opacity="0.95"/>

          <!-- Clouds -->
          <ellipse cx="55"  cy="16" rx="32" ry="9"  fill="rgba(180,210,235,0.14)"/>
          <ellipse cx="40"  cy="13" rx="18" ry="7"  fill="rgba(180,210,235,0.10)"/>
          <ellipse cx="72"  cy="19" rx="22" ry="6"  fill="rgba(180,210,235,0.10)"/>
          <ellipse cx="158" cy="11" rx="26" ry="7"  fill="rgba(180,210,235,0.10)"/>
          <ellipse cx="172" cy="15" rx="17" ry="5"  fill="rgba(180,210,235,0.08)"/>

          <!-- Seagulls -->
          <path d="M102 28 Q106 24 110 28" stroke="rgba(160,200,225,0.65)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M118 22 Q122 18 127 22" stroke="rgba(160,200,225,0.55)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <path d="M132 31 Q135 28 139 31" stroke="rgba(160,200,225,0.50)" stroke-width="1"   fill="none" stroke-linecap="round"/>

          <!-- Stilt village (5 houses, horizon silhouette) -->
          <!-- House 1 -->
          <polygon points="15,56 26,44 37,56"     fill="#091e38" opacity="0.92"/>
          <rect x="16" y="56" width="20" height="14" rx="1" fill="#091e38" opacity="0.92"/>
          <rect x="20" y="62" width="6" height="5" rx="1"  fill="#143358" opacity="0.5"/>
          <line x1="20" y1="70" x2="20" y2="82"  stroke="#091e38" stroke-width="2.2"/>
          <line x1="32" y1="70" x2="32" y2="82"  stroke="#091e38" stroke-width="2.2"/>
          <!-- House 2 -->
          <polygon points="48,53 61,40 74,53"     fill="#0b2240" opacity="0.88"/>
          <rect x="49" y="53" width="24" height="17" rx="1" fill="#0b2240" opacity="0.88"/>
          <rect x="53" y="58" width="7" height="6"  rx="1" fill="#163a5e" opacity="0.5"/>
          <rect x="63" y="58" width="7" height="6"  rx="1" fill="#163a5e" opacity="0.5"/>
          <line x1="54" y1="70" x2="54" y2="82"  stroke="#0b2240" stroke-width="2.5"/>
          <line x1="68" y1="70" x2="68" y2="82"  stroke="#0b2240" stroke-width="2.5"/>
          <!-- House 3 (largest) -->
          <polygon points="84,57 100,42 116,57"   fill="#0d2846" opacity="0.86"/>
          <rect x="85" y="57" width="30" height="18" rx="1" fill="#0d2846" opacity="0.86"/>
          <rect x="90" y="62" width="8" height="7"  rx="1" fill="#1a4068" opacity="0.5"/>
          <rect x="101" y="62" width="8" height="7" rx="1" fill="#1a4068" opacity="0.5"/>
          <line x1="90"  y1="75" x2="90"  y2="82" stroke="#0d2846" stroke-width="2.5"/>
          <line x1="110" y1="75" x2="110" y2="82" stroke="#0d2846" stroke-width="2.5"/>
          <!-- House 4 -->
          <polygon points="126,59 140,47 154,59"  fill="#0b2440" opacity="0.82"/>
          <rect x="127" y="59" width="26" height="15" rx="1" fill="#0b2440" opacity="0.82"/>
          <rect x="132" y="64" width="6" height="5" rx="1" fill="#143356" opacity="0.45"/>
          <line x1="132" y1="74" x2="132" y2="82" stroke="#0b2440" stroke-width="2.2"/>
          <line x1="148" y1="74" x2="148" y2="82" stroke="#0b2440" stroke-width="2.2"/>
          <!-- House 5 (distant, smaller) -->
          <polygon points="196,62 207,53 218,62"  fill="#091e36" opacity="0.7"/>
          <rect x="197" y="62" width="20" height="13" rx="1" fill="#091e36" opacity="0.7"/>
          <line x1="201" y1="75" x2="201" y2="82" stroke="#091e36" stroke-width="1.8"/>
          <line x1="213" y1="75" x2="213" y2="82" stroke="#091e36" stroke-width="1.8"/>

          <!-- Fishing boat -->
          <path d="M162 75 Q183 70 212 72 Q220 73 218 80 Q200 85 165 84 Z" fill="#1a3e5e" opacity="0.9"/>
          <path d="M165 84 Q192 88 216 81" stroke="rgba(26,90,138,0.4)" stroke-width="1.5" fill="none"/>
          <line x1="188" y1="71" x2="188" y2="54" stroke="#0f2a42" stroke-width="2"/>
          <line x1="180" y1="60" x2="196" y2="60" stroke="#0f2a42" stroke-width="1.5"/>
          <polygon points="196,60 207,64 196,69" fill="#1a3a5c" opacity="0.55"/>

          <!-- Water surface -->
          <path d="M0 89 Q22 85 44 89 Q66 93 88 89 Q110 85 132 89 Q154 93 176 89 Q198 85 220 89 Q242 93 264 89 Q286 85 310 89"
                stroke="rgba(80,180,240,0.3)" stroke-width="1.5" fill="none"/>
          <rect x="0" y="89" width="310" height="6" fill="rgba(16,104,136,0.35)" rx="0"/>

          <!-- Transparent hit area -->
          <rect x="0" y="0" width="310" height="95" fill="transparent"/>
        </g>

        <!-- ════════════════════════════
             LAYER 2 — SHALLOW / FISHING
             y: 95–215
        ════════════════════════════ -->
        <g id="layer-fishing" class="ocean-layer" data-clip="fishing">
          <rect x="0" y="95" width="310" height="120" fill="url(#shal-g)"/>

          <!-- Light rays -->
          <polygon points="95,95 112,95 128,215 79,215"  fill="rgba(190,235,255,0.042)"/>
          <polygon points="148,95 160,95 172,215 136,215" fill="rgba(190,235,255,0.050)"/>
          <polygon points="198,95 208,95 218,215 188,215" fill="rgba(190,235,255,0.035)"/>

          <!-- Fish school A — dense, golden -->
          <g id="fish-a" class="fish-g">
            <g fill="#f9c74f" opacity="0.88">
              <ellipse cx="42"  cy="120" rx="7"   ry="3.5"/><polygon points="34,117 27,120 34,123" fill="#f9c74f"/>
              <ellipse cx="66"  cy="113" rx="6.5" ry="3.2"/><polygon points="59,110 52,113 59,116" fill="#f9c74f"/>
              <ellipse cx="88"  cy="124" rx="7"   ry="3.5"/><polygon points="80,121 73,124 80,127" fill="#f9c74f"/>
              <ellipse cx="112" cy="115" rx="6"   ry="3"/><polygon points="106,112 100,115 106,118" fill="#f9c74f"/>
              <ellipse cx="54"  cy="134" rx="5.5" ry="2.8"/><polygon points="48,131 42,134 48,137" fill="#f9c74f"/>
              <ellipse cx="76"  cy="140" rx="6"   ry="3"/><polygon points="70,137 64,140 70,143" fill="#f9c74f"/>
              <ellipse cx="98"  cy="128" rx="5"   ry="2.5"/><polygon points="93,126 88,128 93,130" fill="#f9c74f"/>
              <ellipse cx="30"  cy="108" rx="5"   ry="2.5"/><polygon points="25,106 20,108 25,110" fill="#f9c74f"/>
            </g>
            <!-- Fish school B — blue/cyan -->
            <g fill="#48cae4" opacity="0.72">
              <ellipse cx="140" cy="126" rx="6"   ry="3"/><polygon points="134,123 128,126 134,129" fill="#48cae4"/>
              <ellipse cx="158" cy="134" rx="5.5" ry="2.8"/><polygon points="152,131 146,134 152,137" fill="#48cae4"/>
              <ellipse cx="128" cy="142" rx="5"   ry="2.5"/><polygon points="123,139 118,142 123,145" fill="#48cae4"/>
              <ellipse cx="172" cy="119" rx="6"   ry="3"/><polygon points="166,116 160,119 166,122" fill="#48cae4"/>
              <ellipse cx="150" cy="148" rx="4.5" ry="2.2"/><polygon points="145,146 140,148 145,150" fill="#48cae4"/>
              <ellipse cx="188" cy="132" rx="5"   ry="2.5"/><polygon points="183,130 178,132 183,134" fill="#48cae4"/>
            </g>
            <!-- Fish school C — deeper, smaller, lighter -->
            <g fill="#ade8f4" opacity="0.55">
              <ellipse cx="52"  cy="172" rx="4.5" ry="2.2"/><polygon points="47,170 43,172 47,174" fill="#ade8f4"/>
              <ellipse cx="80"  cy="165" rx="5"   ry="2.5"/><polygon points="75,163 70,165 75,167" fill="#ade8f4"/>
              <ellipse cx="108" cy="173" rx="4"   ry="2"/><polygon points="104,171 100,173 104,175" fill="#ade8f4"/>
              <ellipse cx="192" cy="162" rx="4.5" ry="2.2"/><polygon points="187,160 182,162 187,164" fill="#ade8f4"/>
              <ellipse cx="220" cy="170" rx="4"   ry="2"/><polygon points="216,168 212,170 216,172" fill="#ade8f4"/>
              <ellipse cx="250" cy="155" rx="4"   ry="2"/><polygon points="246,153 242,155 246,157" fill="#ade8f4"/>
            </g>
          </g>

          <!-- Diver -->
          <g id="diver-g" opacity="0.85">
            <ellipse cx="254" cy="122" rx="7" ry="8" fill="#1a3a5c"/>
            <rect x="249" y="120" width="12" height="7" rx="2" fill="#2980b9" opacity="0.8"/>
            <rect x="251" y="130" width="7" height="22" rx="3" fill="#1a3a5c"/>
            <line x1="251" y1="136" x2="240" y2="147" stroke="#1a3a5c" stroke-width="4" stroke-linecap="round"/>
            <line x1="258" y1="136" x2="268" y2="144" stroke="#1a3a5c" stroke-width="4" stroke-linecap="round"/>
            <line x1="268" y1="144" x2="294" y2="154" stroke="#253c52" stroke-width="2" stroke-linecap="round"/>
            <polygon points="294,152 301,154 294,156" fill="#253c52"/>
            <ellipse cx="251" cy="153" rx="9" ry="3" fill="#1a3a5c" transform="rotate(-18,251,153)"/>
            <ellipse cx="261" cy="153" rx="9" ry="3" fill="#1a3a5c" transform="rotate(14,261,153)"/>
            <circle cx="248" cy="116" r="2.2" fill="rgba(160,225,255,0.5)"/>
            <circle cx="244" cy="108" r="1.6" fill="rgba(160,225,255,0.4)"/>
            <circle cx="247" cy="101" r="1.1" fill="rgba(160,225,255,0.35)"/>
            <circle cx="243" cy="95"  r="0.8" fill="rgba(160,225,255,0.28)"/>
          </g>

          <!-- Sea floor + coral (healthy) -->
          <rect x="0" y="207" width="310" height="8" fill="#093446" opacity="0.9"/>

          <g id="coral-shallow" class="coral-el">
            <!-- Coral 1: branching magenta -->
            <g stroke="#e040a0" stroke-width="3.5" stroke-linecap="round" fill="none">
              <line x1="36" y1="207" x2="36" y2="182"/>
              <line x1="36" y1="196" x2="24" y2="179"/>
              <line x1="36" y1="189" x2="48" y2="174"/>
              <line x1="24" y1="185" x2="15" y2="175"/>
              <line x1="48" y1="181" x2="54" y2="171"/>
            </g>
            <g fill="#ff6ec7" opacity="0.85">
              <circle cx="36" cy="182" r="3.2"/><circle cx="24" cy="179" r="2.8"/>
              <circle cx="48" cy="174" r="2.8"/><circle cx="15" cy="175" r="2.2"/>
              <circle cx="54" cy="171" r="2.2"/>
            </g>
            <!-- Coral 2: brain coral, amber -->
            <ellipse cx="108" cy="202" rx="22" ry="11" fill="#f4a61d" opacity="0.88"/>
            <path d="M88 202 Q95 196 104 202 Q112 208 120 202 Q127 196 130 202" stroke="#b07800" stroke-width="1.5" fill="none" opacity="0.45"/>
            <!-- Coral 3: branching purple -->
            <g stroke="#9b59b6" stroke-width="3" stroke-linecap="round" fill="none">
              <line x1="168" y1="207" x2="168" y2="184"/>
              <line x1="168" y1="198" x2="157" y2="181"/>
              <line x1="168" y1="191" x2="178" y2="178"/>
              <line x1="157" y1="190" x2="149" y2="180"/>
            </g>
            <g fill="#c078e0" opacity="0.85">
              <circle cx="168" cy="184" r="3"/><circle cx="157" cy="181" r="2.5"/>
              <circle cx="178" cy="178" r="2.5"/><circle cx="149" cy="180" r="2"/>
            </g>
            <!-- Coral 4: fan coral, emerald -->
            <path d="M224 207 Q213 186 218 172 Q226 158 236 172 Q242 186 232 207 Z" fill="#27ae60" opacity="0.78"/>
            <path d="M228 207 Q224 194 226 182 Q229 170 232 182 Q234 194 230 207 Z" fill="#2ecc71" opacity="0.45"/>
            <!-- Coral 5: small branching, teal -->
            <g stroke="#16a085" stroke-width="2.5" stroke-linecap="round" fill="none">
              <line x1="276" y1="207" x2="276" y2="191"/>
              <line x1="276" y1="200" x2="267" y2="189"/>
              <line x1="276" y1="195" x2="284" y2="186"/>
            </g>
            <g fill="#1abc9c" opacity="0.82">
              <circle cx="276" cy="191" r="2.8"/>
              <circle cx="267" cy="189" r="2.2"/>
              <circle cx="284" cy="186" r="2.2"/>
            </g>
          </g>

          <rect x="0" y="95" width="310" height="120" fill="transparent"/>
        </g>

        <!-- ════════════════════════════
             LAYER 3 — MID / ECONOMIC
             y: 215–325
        ════════════════════════════ -->
        <g id="layer-economic" class="ocean-layer" data-clip="economic">
          <rect x="0" y="215" width="310" height="110" fill="url(#mid-g)"/>

          <!-- Sparse fish -->
          <g id="fish-mid" class="fish-g" opacity="0.6">
            <g fill="#90e0ef">
              <ellipse cx="52"  cy="242" rx="6"   ry="3"/><polygon points="46,239 40,242 46,245" fill="#90e0ef"/>

    video: 'https://github.com/fukexuexue/interactive-video-fishing/releases/download/v1/Economic_PressureFish_Worth_Less.mp4',
    layerId: 'layer-economic',
    barY: 215, barH: 110,
  },
  {
    id: 'destructive', n: 4,
    depth: 'Deep  ·  09:00 – 12:30',
    title: 'Destructive Fishing',
    desc:  'Economic desperation drives cyanide and dynamite fishing — the reefs that sustain life are now being destroyed.',
    role:  'Crisis escalation: the wound deepens',
    color: '#c0392b',
    video: 'https://github.com/fukexuexue/interactive-video-fishing/releases/download/v1/Destructive.Fishing.and.Environmental.Crisis.mp4',
    layerId: 'layer-destructive',
    barY: 325, barH: 105,
  },
  {
    id: 'future', n: 5,
    depth: 'Depths  ·  12:30 – 16:12',
    title: 'Uncertain Future',
    desc:  'The fisherman\'s children — what world will they inherit? They still belong to the sea. But their path forward is open.',
    role:  'The question left unanswered',
    color: '#7d3c98',
    video: 'https://github.com/fukexuexue/interactive-video-fishing/releases/download/v1/Uncertain.Future.for.the.Next.Generation.mp4',
    layerId: 'layer-future',
    barY: 430, barH: 70,
  },
];

/* ═══════════════════════════════════
   ECOLOGICAL STATES
   (SVG changes as narrative darkens)
═══════════════════════════════════ */
const ECO = {
  living:      { coralF:'saturate(1) brightness(1)',      fishA:1,    midF:0.60, shockOp:0,   diverOp:0.25, childOp:0.38 },
  fishing:     { coralF:'saturate(0.92) brightness(1.04)',fishA:0.88, midF:0.55, shockOp:0,   diverOp:0.88, childOp:0.38 },
  economic:    { coralF:'saturate(0.32) brightness(1.22)',fishA:0.38, midF:0.38, shockOp:0,   diverOp:0.45, childOp:0.38 },
  destructive: { coralF:'saturate(0) brightness(1.55)',   fishA:0.08, midF:0.12, shockOp:0.7, diverOp:0.12, childOp:0.38 },
  future:      { coralF:'saturate(0) brightness(0.52)',   fishA:0.04, midF:0.06, shockOp:0.3, diverOp:0.05, childOp:0.95 },
};

/* ═══════════════════════════════════
   BUILD TIMELINE STRIP
═══════════════════════════════════ */
const strip = document.getElementById('timeline-strip');
CLIPS.forEach(clip => {
  const seg = document.createElement('div');
  seg.className = 'timeline-seg';
  seg.id = `ts-${clip.id}`;
  seg.style.borderColor = clip.color + '33';
  seg.innerHTML = `<span class="t-n">${clip.n}</span><span class="t-label">${clip.title}</span>`;
  seg.addEventListener('click', () => selectClip(clip.id));
  strip.appendChild(seg);
});

/* ═══════════════════════════════════
   SVG LAYER INTERACTIONS
═══════════════════════════════════ */
let activeId = null;

CLIPS.forEach(clip => {
  const layer = document.getElementById(clip.layerId);
  if (!layer) return;

  layer.addEventListener('mouseenter', ev => {
    if (clip.id !== activeId) layer.style.filter = 'brightness(1.18)';
    showTip(`${clip.n}  ${clip.title}  ·  ${clip.depth}`, ev);
  });
  layer.addEventListener('mousemove', ev => moveTip(ev));
  layer.addEventListener('mouseleave', () => {
    if (clip.id !== activeId) layer.style.filter = '';
    hideTip();
  });
  layer.addEventListener('click', () => selectClip(clip.id));
});

/* ═══════════════════════════════════
   SELECT CLIP
═══════════════════════════════════ */
function selectClip(id) {
  const clip = CLIPS.find(c => c.id === id);
  if (!clip) return;
  activeId = id;

  // Info panel
  document.getElementById('clip-n').textContent     = clip.n;
  document.getElementById('clip-n').style.color     = clip.color;
  document.getElementById('clip-depth').textContent = clip.depth;
  document.getElementById('clip-title').textContent = clip.title;
  document.getElementById('clip-title').style.color = clip.color;
  document.getElementById('clip-desc').textContent  = clip.desc;
  document.getElementById('clip-role').textContent  = clip.role;

  // Active indicator bar
  const bar = document.getElementById('active-bar');
  bar.setAttribute('y',       clip.barY);
  bar.setAttribute('height',  clip.barH);
  bar.setAttribute('fill',    clip.color);
  bar.setAttribute('opacity', '0.9');

  // Layer highlights
  CLIPS.forEach(c => {
    const l = document.getElementById(c.layerId);
    if (l) l.style.filter = c.id === id ? 'brightness(1.22)' : '';
  });

  // Timeline strip
  CLIPS.forEach(c => {
    const s = document.getElementById(`ts-${c.id}`);
    if (!s) return;
    if (c.id === id) {
      s.classList.add('active');
      s.style.cssText = `background:${c.color}20;border-color:${c.color}77;color:${c.color}`;
    } else {
      s.classList.remove('active');
      s.style.cssText = `background:'';border-color:${c.color}33;color:''`;
    }
  });

  // Video
  const player = document.getElementById('video-player');
  document.getElementById('idle-overlay').style.display = 'none';
  player.src = encodeURI(clip.video);
  player.load();
  player.play().catch(() => {});

  // Ocean ecological state
  applyEcoState(id);

  // Keep fisherman in sync when navigation comes from layer/timeline click
  const clipIdx = CLIPS.findIndex(c => c.id === id);
  if (clipIdx !== -1) moveFisherToIdx(clipIdx);

  hideTip();
}

/* ═══════════════════════════════════
   APPLY ECOLOGICAL STATE
═══════════════════════════════════ */
function applyEcoState(id) {
  const e = ECO[id]; if (!e) return;

  // Coral: all three coral groups
  ['coral-shallow','coral-mid','coral-deep'].forEach(gid => {
    const el = document.getElementById(gid);
    if (el) el.style.filter = e.coralF;
  });

  // Fish
  const fa = document.getElementById('fish-a');    if (fa) fa.style.opacity = e.fishA;
  const fm = document.getElementById('fish-mid');  if (fm) fm.style.opacity = e.midF;
  const fd = document.getElementById('fish-deep'); if (fd) fd.style.opacity = e.fishA * 0.3;

  // Shockwave
  const sw = document.getElementById('shockwave'); if (sw) sw.style.opacity = e.shockOp;

  // Diver
  const dv = document.getElementById('diver-g');   if (dv) dv.style.opacity = e.diverOp;

  // Children
  const ch = document.getElementById('children-g');if (ch) ch.style.opacity = e.childOp;
}

/* ═══════════════════════════════════
   FISHERMAN DRAG SYSTEM
═══════════════════════════════════ */

// SVG Y home position for each layer (where fisherman snaps to)
const FISHER_HOMES      = [65, 155, 268, 375, 462];
// SVG Y thresholds between layers
const FISHER_THRESHOLDS = [92, 215, 325, 430];

let fisherDrag   = false;
let fisherIdx    = 0;   // current layer index
let hintVisible  = true;

const fisherEl   = document.getElementById('fisherman-group');
const fishLine   = document.getElementById('fish-line-dyn');
const fisherSurf = document.getElementById('fisher-surface');
const fisherSub  = document.getElementById('fisher-underwater');
const fisherHint = document.getElementById('fisher-hint');
const fisherGlow = document.getElementById('fisher-glow-circle');

/* Convert browser clientY → SVG coordinate Y */
function clientToSVGY(clientY) {
  const svg  = document.getElementById('ocean-svg');
  const rect = svg.getBoundingClientRect();
  return (clientY - rect.top) * (500 / rect.height);
}

/* Which layer index does this SVG Y fall in? */
function yToIdx(svgY) {
  for (let i = 0; i < FISHER_THRESHOLDS.length; i++) {
    if (svgY < FISHER_THRESHOLDS[i]) return i;
  }
  return 4;
}

/* Update fisherman visuals (appearance + dynamic line) without clip selection */
function updateFisherVisuals(svgY) {
  const below = svgY >= 90;
  fisherSurf.style.opacity = below ? '0' : '1';
  fisherSub.style.opacity  = below ? '1' : '0';

  if (below) {
    // Curve the fishing line slightly with depth
    const slack = Math.min((svgY - 90) * 0.11, 18);
    fishLine.setAttribute('d',
      `M155 ${svgY - 14} Q${155 + slack} ${(svgY + 88) / 2} 155 89`);
    fishLine.style.opacity = String(Math.min(0.55, (svgY - 90) / 40));
  } else {
    fishLine.style.opacity = '0';
  }

  // Glow matches current layer's color
  const idx = yToIdx(svgY);
  if (fisherGlow) fisherGlow.setAttribute('fill', CLIPS[idx].color);
}

/* Move fisherman during drag — detects layer crossings */
function dragFisher(clientY) {
  let svgY = Math.max(12, Math.min(490, clientToSVGY(clientY)));

  fisherEl.setAttribute('transform', `translate(155, ${svgY})`);
  updateFisherVisuals(svgY);

  const newIdx = yToIdx(svgY);
  if (newIdx !== fisherIdx) {
    fisherIdx = newIdx;

    // Flash the layer being entered
    const layerEl = document.getElementById(CLIPS[newIdx].layerId);
    if (layerEl) {
      layerEl.style.filter = 'brightness(1.7)';
      setTimeout(() => {
        layerEl.style.filter = activeId === CLIPS[newIdx].id ? 'brightness(1.22)' : '';
      }, 240);
    }

    // Trigger clip — set flag so selectClip won't re-move fisherman
    fisherDrag = false;         // temporarily, so selectClip's guard works
    selectClip(CLIPS[newIdx].id);
    fisherDrag = true;          // restore
  }
}

/* Snap fisherman to a layer's home Y with spring animation */
function snapFisherToLayer(idx) {
  const homeY = FISHER_HOMES[idx];
  fisherEl.style.transition = 'transform 0.55s cubic-bezier(.34,1.56,.64,1)';
  fisherEl.setAttribute('transform', `translate(155, ${homeY})`);
  setTimeout(() => {
    fisherEl.style.transition = '';
    updateFisherVisuals(homeY);
  }, 580);
}

/* Called from selectClip to keep fisherman in sync with layer clicks */
function moveFisherToIdx(idx) {
  if (fisherDrag) return;       // don't interrupt a drag
  fisherIdx = idx;
  snapFisherToLayer(idx);
}

/* ── Mouse events ── */
fisherEl.addEventListener('mousedown', ev => {
  ev.preventDefault();
  ev.stopPropagation();         // don't trigger SVG layer click
  fisherDrag = true;
  fisherEl.classList.add('dragging');
  // Hide the hint text permanently after first touch
  if (hintVisible) { fisherHint.style.opacity = '0'; hintVisible = false; }
});

document.addEventListener('mousemove', ev => {
  if (!fisherDrag) return;
  dragFisher(ev.clientY);
});

document.addEventListener('mouseup', () => {
  if (!fisherDrag) return;
  fisherDrag = false;
  fisherEl.classList.remove('dragging');
  snapFisherToLayer(fisherIdx);
});

/* ═══════════════════════════════════
   DYNAMITE THROW SYSTEM
═══════════════════════════════════ */

const DYN_START   = { x: 234, y: 68 };  // home position in SVG coords
const dynEl       = document.getElementById('dynamite-group');
const throwArcEl  = document.getElementById('throw-arc');
const expRingsEl  = document.getElementById('explosion-rings');
const expR1       = document.getElementById('exp-r1');
const expR2       = document.getElementById('exp-r2');
const expR3       = document.getElementById('exp-r3');
const dynGlow     = document.getElementById('dyn-glow');
const dynHint     = document.getElementById('dyn-hint');

let dynDragging   = false;
let dynCurrent    = { ...DYN_START };

/* Convert browser coords → SVG coords (both X and Y) */
function clientToSVGCoords(cx, cy) {
  const svg = document.getElementById('ocean-svg');
  const r   = svg.getBoundingClientRect();
  return {
    x: (cx - r.left) * (310 / r.width),
    y: (cy - r.top)  * (500 / r.height),
  };
}

/* Draw the parabolic aim arc */
function updateAimArc(tx, ty) {
  const sx   = DYN_START.x, sy = DYN_START.y;
  const mx   = (sx + tx) / 2;
  const rise = Math.abs(tx - sx) * 0.55 + 20;
  const peakY = Math.min(sy, ty) - rise;
  throwArcEl.setAttribute('d', `M${sx} ${sy} Q${mx} ${peakY} ${tx} ${ty}`);
  throwArcEl.style.opacity = '1';
}

/* Animate dynamite along a bezier arc then explode */
function launchDynamite(toX, toY) {
  throwArcEl.style.opacity = '0';
  const sx = DYN_START.x, sy = DYN_START.y;
  const mx = (sx + toX) / 2;
  const rise = Math.abs(toX - sx) * 0.55 + 20;
  const peakY = Math.min(sy, toY) - rise;

  const dur   = 650;
  const t0    = Date.now();

  function step() {
    const t  = Math.min(1, (Date.now() - t0) / dur);
    const u  = 1 - t;
    // Quadratic bezier
    const x  = u * u * sx + 2 * u * t * mx + t * t * toX;
    const y  = u * u * sy + 2 * u * t * peakY + t * t * toY;
    const deg = t * 600;   // spin

    dynEl.setAttribute('transform', `translate(${x}, ${y}) rotate(${deg})`);

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      onDynamiteLand(toX, toY);
    }
  }
  requestAnimationFrame(step);
}

/* Handle landing */
function onDynamiteLand(x, y) {
  // Hide dynamite briefly
  dynEl.style.opacity = '0';

  // Animate explosion rings
  expRingsEl.setAttribute('transform', `translate(${x}, ${y})`);
  expRingsEl.style.opacity = '1';

  const t0 = Date.now();
  const big = y > 325;  // deeper = bigger boom
  const maxR = big ? 120 : 70;

  function animExp() {
    const t = Math.min(1, (Date.now() - t0) / 750);
    expR1.setAttribute('r', String(6  + t * maxR * 0.70));
    expR2.setAttribute('r', String(6  + t * maxR * 0.90));
    expR3.setAttribute('r', String(6  + t * maxR * 1.00));
    expR1.style.opacity = String(0.9 * (1 - t));
    expR2.style.opacity = String(0.6 * (1 - t));
    expR3.style.opacity = String(0.35 * (1 - t));
    if (t < 1) { requestAnimationFrame(animExp); }
    else        { expRingsEl.style.opacity = '0'; }
  }
  requestAnimationFrame(animExp);

  // Activate the SVG shockwave already in the deep layer
  const sw = document.getElementById('shockwave');
  if (sw) {
    sw.style.transition = 'opacity 0.1s';
    sw.style.opacity    = '0.95';
    setTimeout(() => { sw.style.transition = 'opacity 1.5s'; sw.style.opacity = '0.7'; }, 200);
  }

  // Flash the whole SVG orange-white
  const flash = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  flash.setAttribute('x', '0'); flash.setAttribute('y', '0');
  flash.setAttribute('width', '310'); flash.setAttribute('height', '500');
  flash.setAttribute('fill', big ? 'rgba(255,160,40,0.30)' : 'rgba(255,160,40,0.18)');
  flash.style.pointerEvents = 'none';
  document.getElementById('ocean-svg').appendChild(flash);
  setTimeout(() => {
    flash.style.transition = 'opacity 0.5s';
    flash.style.opacity    = '0';
    setTimeout(() => flash.remove(), 520);
  }, 60);

  // Play the destructive clip after brief delay
  setTimeout(() => selectClip('destructive'), 380);

  // Regenerate dynamite back to start after a moment
  setTimeout(() => {
    dynEl.style.transition = 'transform 0.5s cubic-bezier(.34,1.56,.64,1), opacity 0.4s';
    dynEl.setAttribute('transform', `translate(${DYN_START.x}, ${DYN_START.y})`);
    dynEl.style.opacity    = '1';
    dynCurrent = { ...DYN_START };
    setTimeout(() => dynEl.style.transition = '', 560);
    dynGlow.setAttribute('opacity', '0.06');
  }, 1600);
}

/* Reset dynamite (if not thrown into water) */
function resetDynamite() {
  dynEl.style.transition = 'transform 0.45s cubic-bezier(.34,1.56,.64,1)';
  dynEl.setAttribute('transform', `translate(${DYN_START.x}, ${DYN_START.y})`);
  dynCurrent = { ...DYN_START };
  setTimeout(() => dynEl.style.transition = '', 500);
  dynGlow.setAttribute('opacity', '0.06');
}

/* ── Mouse events ── */
dynEl.addEventListener('mousedown', ev => {
  ev.preventDefault();
  ev.stopPropagation();
  dynDragging = true;
  dynEl.classList.add('dy-drag');
  if (dynHint) dynHint.style.opacity = '0';
  dynGlow.setAttribute('opacity', '0.20');
});

document.addEventListener('mousemove', ev => {
  if (!dynDragging) return;
  const c = clientToSVGCoords(ev.clientX, ev.clientY);
  dynCurrent = c;
  // Move dynamite with cursor (small tilt by horizontal offset)
  const tilt = (c.x - DYN_START.x) * 0.3;
  dynEl.setAttribute('transform', `translate(${c.x}, ${c.y}) rotate(${tilt})`);
  // Show aim arc
  updateAimArc(c.x, c.y);
});

document.addEventListener('mouseup', ev => {
  if (!dynDragging) return;
  dynDragging = false;
  dynEl.classList.remove('dy-drag');
  throwArcEl.style.opacity = '0';

  const c = clientToSVGCoords(ev.clientX, ev.clientY);

  if (c.y > 95) {
    // Thrown into water — launch animation
    launchDynamite(c.x, c.y);
  } else {
    // Dropped above water — reset
    resetDynamite();
  }
});

/* ═══════════════════════════════════
   TOOLTIP
═══════════════════════════════════ */
function showTip(t, ev) {
  const el = document.getElementById('tooltip');
  el.textContent = t; el.style.display = 'block'; moveTip(ev);
}
function moveTip(ev) {
  const el = document.getElementById('tooltip');
  el.style.left = (ev.clientX + 14) + 'px';
  el.style.top  = (ev.clientY - 30) + 'px';
}
function hideTip() { document.getElementById('tooltip').style.display = 'none'; }
</script>
